networks:
   tileserver-net:

services:
  tileserver-init:
    image: docker.io/library/alpine
    networks:
      - tileserver-net
    restart: "no"
    entrypoint: |
      /bin/sh -c "mkdir -p /data/cache && chown -R 101:101 /data/cache"
    volumes:
      - ./data/cache:/data/cache

  tileserver-app:
    container_name: tileserver-app
    restart: unless-stopped
    image: docker.io/maptiler/tileserver-gl:v5.7.0
    networks:
      - tileserver-net
    volumes:
      - ./data:/data:ro
    command: ["-p", "8080", "-c", "/data/config.json"]
    expose:
      - 8080
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges
    # /health returns 503 until all styles and data are loaded.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace period only: the container is healthy at the first successful check.
      start_period: 120s

  tileserver-cache:
    container_name: tileserver-cache
    restart: unless-stopped
    image: docker.io/nginxinc/nginx-unprivileged:1.31
    networks:
      - tileserver-net
    # Wait until tileserver-app serves the current data. If it does not become
    # healthy, start anyway (required: false, Compose 2.20+): cached tiles stay
    # available and errors are not cached.
    depends_on:
      tileserver-init:
        condition: service_completed_successfully
      tileserver-app:
        condition: service_healthy
        required: false
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - ./nginx/05-invalidate-cache.sh:/docker-entrypoint.d/05-invalidate-cache.sh:ro
      - ./data:/data:ro
      - ./data/cache:/var/cache/nginx
    ports:
      - "127.0.0.1:8081:8081"
    security_opt:
      - no-new-privileges
    environment:
      - TILESERVER_APP=tileserver-app:8080
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-25g}
      - CACHE_MIN_FREE=${CACHE_MIN_FREE:-20g}
      - CACHE_INACTIVE=${CACHE_INACTIVE:-30d}
